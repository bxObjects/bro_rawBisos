<H2 CLASS="section"><!--SEC ANCHOR --><A NAME="htoc1">1</A>  The Wap Trap</H2><!--SEC END --><P>In 2000, we provided a detailed criticism of a set of specifications called the “Wireless
Application Protocol”, or WAP. We warned that WAP is booby-trapped with patents and that
WAP is entirely unfit to play the role of a Mobile Messaging industry standard. </P><P>Key relevant documents for this project are:</P><BLOCKQUOTE CLASS="quote">
<B>The WAP Trap</B><BR>
 <B>An Expose of the Wireless Application Protocol</B><BR>
 <A HREF="http://www.freeprotocols.org/PLPC/100014">http://www.freeprotocols.org/PLPC/100014</A>
</BLOCKQUOTE><P><BR>
</P><BLOCKQUOTE CLASS="quote">
<B>Le WAP a la trappe</B><BR>
 <B>Un expose sur le Wireless Application Protocol</B><BR>
 <A HREF="http://www.freeprotocols.org/PLPC/100015">http://www.freeprotocols.org/PLPC/100015</A>
</BLOCKQUOTE><P><BR>
</P><BLOCKQUOTE CLASS="quote">
<B>WAP - The Patent Problem</B><BR>
 <A HREF="http://www.freeprotocols.org/PLPC/100025">http://www.freeprotocols.org/PLPC/100025</A>
</BLOCKQUOTE><!--TOC section The Harm of the Wireless Application Protocol (WAP)-->
<H2 CLASS="section"><!--SEC ANCHOR --><A NAME="htoc2">2</A>  The Harm of the Wireless Application Protocol (WAP)</H2><!--SEC END --><P>The Wireless Application Protocol (WAP) is a disaster waiting to
happen. First, the WAP protocols are <A HREF="http://web.freeprotocols.org/wapTrap/WapShortPatentProblem/one/index.html">booby-trapped
with patents</A>. Patent
infringement claims have already been made by the holders of the
following two patents, and more claims can almost certainly be
expected in the future:</P><UL CLASS="itemize"><LI CLASS="li-itemize">
U.S. Patent # 5,327,529 - <I>Geoworks, Berkeley,
Calif.</I>. Process of designing user’s interfaces for
application programs.<BR>
Local Copies:
<A HREF="http://web.freeprotocols.org/usPatents/05327529_001.pdf">(PDF)</A>
<A HREF="http://web.freeprotocols.org/usPatents/05327529_001.ps">(PS)</A>
</LI><LI CLASS="li-itemize">U.S. Patent # 5,809,415 - <I>Unwired Planet, Inc., Redwood
Shores, Calif.</I>. Method and architecture for an interactive
two-way data communication network.<BR>
Local Copies:
<A HREF="http://web.freeprotocols.org/usPatents/05809415_001.pdf">(PDF-Part
1)</A>
<A HREF="http://web.freeprotocols.org/usPatents/05809415_002.pdf">(PDF-Part
2)</A>
<A HREF="http://web.freeprotocols.org/usPatents/05809415_001.ps">(PS-Part 1)</A>
<A HREF="http://web.freeprotocols.org/usPatents/05809415_002.ps">(PS-Part 2)</A>
</LI></UL><P>In addition, the WAP protocols are ill-conceived, closed, and
poorly-designed. The following documents provide a detailed
discussion and analysis of WAP:</P><UL CLASS="itemize"><LI CLASS="li-itemize">
<I>The WAP Trap</I>, Mohsen Banan,
Neda Communications, Inc., January 29, 2000<BR>
 <A HREF="http://web.freeprotocols.org/wapTrap/one/main.html">(ONE-HTML)</A>
<A HREF="http://web.freeprotocols.org/wapTrap/split/main.html">(SPLIT-HTML)</A>
<A HREF="http://web.freeprotocols.org/wapTrap/main.pdf">(PDF)</A>
