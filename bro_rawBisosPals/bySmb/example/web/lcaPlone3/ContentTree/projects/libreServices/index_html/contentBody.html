<H2 CLASS="section"><!--SEC ANCHOR --><A NAME="htoc1">1</A>  Halaal Internet Application Services</H2><!--SEC END --><P>Towards the goal of promoting development and use of Halaal Software and Halaal Internet
Application Services within the existing Western legal framework of Copyright and Patents,
we have formed the general frame works of “Libre Services”, “Autonomous Libre Services” and 
“Federations Of Autonomous Services.”</P><!--TOC subsection Libre Services (LibreServices.org)-->
<H3 CLASS="subsection"><!--SEC ANCHOR --><A NAME="htoc2">1.1</A>  Libre Services (LibreServices.org)</H3><!--SEC END --><P>Libre Services are free software ideology for Internet services.</P><P>The main web site for this project is:
<A HREF="http://www.libreservices.org">libreservices.org</A></P><P>Key relevant documents for this project are:</P><BLOCKQUOTE CLASS="quote">
<B>Libre Services</B><BR>
 <B>A non-proprietary model for delivery of Internet services</B><BR>
 <A HREF="http://www.freeprotocols.org/PLPC/100101">http://www.freeprotocols.org/PLPC/100101</A>
</BLOCKQUOTE><!--TOC subsection Autonomous Libre Services-->
<H3 CLASS="subsection"><!--SEC ANCHOR --><A NAME="htoc3">1.2</A>  Autonomous Libre Services</H3><!--SEC END --><P>An Autonomous Libre Services is a Libre Service where the primary user of the service is
the “owner” of the service. 
The concept of Autonomous Libre Services focuses on preserving
privacy by providing control over information to users with safe guards of
functional transparency, information portability and non-retention controls.
Formal definitions are provided in 
<A HREF="http://www.persoarabic.org/PLPC/120041">Defining Halaal Manner-Of-Existence Of Software – 
And Defining Halaal Internet Application Services</A></P><!--TOC subsection Federated Libre Services-->
<H3 CLASS="subsection"><!--SEC ANCHOR --><A NAME="htoc4">1.3</A>  Federated Libre Services</H3><!--SEC END --><P>The concept of Federation of Libre Services is layered above Autonomous Libre Services and
focuses on interactions amongst Autonomous Libre Services and faciltation of information
aggregation amongst Libre Services.</P><P>Key relevant documents for this project is:
</P><BLOCKQUOTE CLASS="quote">
<B>ByStar Federation of Autonomous Libre Services</B><BR>
 <B>Overview of Concepts and Models</B><BR>
 <A HREF="http://www.freeprotocols.org/PLPC/180011">http://www.freeprotocols.org/PLPC/180011</A>
</BLOCKQUOTE><!--CUT END -->
