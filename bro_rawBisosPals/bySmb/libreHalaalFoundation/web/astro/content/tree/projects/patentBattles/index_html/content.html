<H3 CLASS="subsection"><!--SEC ANCHOR --><A NAME="htoc2">1.1</A>  The Harm of the Wireless Application Protocol (WAP)</H3><!--SEC END --><P>The Wireless Application Protocol (WAP) is a disaster waiting to
happen. First, the WAP protocols are <A HREF="http://web.libre-halaal.org/wapTrap/WapShortPatentProblem/one/index.html">booby-trapped
with patents</A>. Patent
infringement claims have already been made by the holders of the
following two patents, and more claims can almost certainly be
expected in the future:</P><UL CLASS="itemize"><LI CLASS="li-itemize">
U.S. Patent # 5,327,529 - <I>Geoworks, Berkeley,
Calif.</I>. Process of designing user’s interfaces for
application programs.<BR>
Local Copies:
<A HREF="http://web.libre-halaal.org/usPatents/05327529_001.pdf">(PDF)</A>
<A HREF="http://web.libre-halaal.org/usPatents/05327529_001.ps">(PS)</A>
</LI><LI CLASS="li-itemize">U.S. Patent # 5,809,415 - <I>Unwired Planet, Inc., Redwood
Shores, Calif.</I>. Method and architecture for an interactive
two-way data communication network.<BR>
Local Copies:
<A HREF="http://web.libre-halaal.org/usPatents/05809415_001.pdf">(PDF-Part
1)</A>
<A HREF="http://web.libre-halaal.org/usPatents/05809415_002.pdf">(PDF-Part
2)</A>
<A HREF="http://web.libre-halaal.org/usPatents/05809415_001.ps">(PS-Part 1)</A>
<A HREF="http://web.libre-halaal.org/usPatents/05809415_002.ps">(PS-Part 2)</A>
</LI></UL><P>For additional information see LHF Project:
<A HREF="http://www.libre-halaal.org/projects/wapTrap">The WAP Trap</A>.</P><!--CUT END -->
